name: 🐛 Bug Report
description: Report a bug or unexpected behavior in plasma-minimal-osd
title: "[Bug] "
labels: ["Bug", "Needs Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please fill out the following information to help us diagnose and fix the problem.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, KDE Plasma version, Display Server (Wayland/X11), and Monitor setup
      placeholder: "Arch Linux, KDE Plasma 6.2.2, Wayland, Dual Monitors (DP-1 + HDMI-A-1)"
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Describe the steps required to reproduce the issue
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Output from plasmashell or journalctl (e.g. journalctl --user -u plasma-plasmashell -e)
      placeholder: '```text\n[log output here]\n```'
    validations:
      required: false
